target-version = "py313"
line-length = 100

[lint]
# 厳格寄りに広めのルールセットを有効化（フォーマッタ競合・過剰摩擦のものは除外）
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "N",     # pep8-naming
  "UP",    # pyupgrade
  "YTT",   # flake8-2020
  "ANN",   # flake8-annotations（型注釈の強制）
  "ASYNC", # flake8-async
  "S",     # flake8-bandit（セキュリティ）
  "BLE",   # flake8-blind-except
  "B",     # flake8-bugbear
  "A",     # flake8-builtins
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "T10",   # flake8-debugger
  "EM",    # flake8-errmsg
  "FA",    # flake8-future-annotations
  "ISC",   # flake8-implicit-str-concat
  "ICN",   # flake8-import-conventions
  "LOG",   # flake8-logging
  "G",     # flake8-logging-format
  "PIE",   # flake8-pie
  "T20",   # flake8-print
  "PT",    # flake8-pytest-style
  "RSE",   # flake8-raise
  "RET",   # flake8-return
  "SLF",   # flake8-self
  "SIM",   # flake8-simplify
  "TID",   # flake8-tidy-imports
  "TC",    # flake8-type-checking
  "ARG",   # flake8-unused-arguments
  "PTH",   # flake8-use-pathlib
  "ERA",   # eradicate（コメントアウトされたコード）
  "PGH",   # pygrep-hooks
  "PL",    # pylint
  "TRY",   # tryceratops
  "FLY",   # flynt
  "PERF",  # perflint
  "FURB",  # refurb
  "RUF",   # ruff-specific
]

ignore = [
  "ANN401", # *args/**kwargs 等の Any を許容
  "ISC001", # フォーマッタと競合するため無効化
  "TRY003", # 例外メッセージのリテラルを許容（EM ルールと役割が重複）
]

[lint.per-file-ignores]
# テストでは assert・型注釈・マジック値・privateアクセス等を許容
"**/test_*.py" = ["S101", "ANN", "PLR2004", "ARG", "SLF001"]
"**/tests/**/*.py" = ["S101", "ANN", "PLR2004", "ARG", "SLF001"]
"**/conftest.py" = ["S101", "ANN", "ARG"]
# 再エクスポート用途の未使用 import を許容
"**/__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
